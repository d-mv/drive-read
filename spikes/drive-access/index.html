<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drive Read: access spike</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg">
<style>
:root { color-scheme: light dark; --paper: #F3F0E8; --ink: #1C1B19; --ink2: #5C5850; --rule: #CCC6B8; --signal: #D9480F }
@media (prefers-color-scheme: dark) { :root { --paper: #171614; --ink: #E6E2D8; --ink2: #A39E92; --rule: #383630; --signal: #F0672A } }
body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.45 system-ui, sans-serif }
main { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; display: flex; flex-direction: column; gap: 16px }
h1 { margin: 0; font-size: 22px; font-weight: 600 }
p { margin: 0; color: var(--ink2) }
.row { display: flex; flex-wrap: wrap; gap: 8px }
button { min-height: 44px; padding: 0 16px; border: 1px solid var(--ink); border-radius: 3px; background: none; color: inherit; font: inherit; cursor: pointer }
button:disabled { opacity: 0.4; cursor: default }
#log { margin: 0; padding: 12px; border: 1px solid var(--rule); min-height: 240px; white-space: pre-wrap; word-break: break-word; font: 12px/1.5 ui-monospace, Menlo, monospace }
.verdict { font-weight: 600; color: var(--signal) }
#folder { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--rule) }
#folder button { width: 100%; min-height: 40px; border: 0; border-bottom: 1px solid var(--rule); border-radius: 0; text-align: left; padding: 0 8px }
</style>
</head>
<body>
<main>
<h1>Drive Read: access spike</h1>
<p>Drive API only (<code>drive.readonly</code> + <code>drive.appdata</code>, no Picker): sign-in popup (also from an installed app), folder browsing and downloads, a whole-Drive book search, the appData folder, and the CSP.</p>
<div class="row">
<button id="connect" type="button">1. Connect Drive</button>
<button id="browse" type="button" disabled>2. Browse from My Drive</button>
<button id="books" type="button" disabled>3. Find all books</button>
<button id="appdata" type="button" disabled>4. appData round-trip</button>
<button id="copy" type="button">Copy log</button>
</div>
<p id="mode"></p>
<p id="trail"></p>
<ul id="folder"></ul>
<pre id="log" aria-live="polite"></pre>
</main>
<script type="module" src="/spike.js"></script>
</body>
</html>
