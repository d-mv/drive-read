# Desktop packaging (docs/DESKTOP.md). macOS, Apple Silicon only, for this Mac: built
# locally by scripts/package-desktop.ts, never distributed.
appId: net.mlnkv.driveread
productName: Drive Read
directories:
  output: desktop/release
  buildResources: desktop/resources
# The web build and the bundled main/preload are all the app needs at run time.
files:
  - package.json
  - dist/**
  - desktop/out/**
  - '!**/node_modules/**'
asar: true
# Nothing native ships (main is bundled), so no rebuild of node_modules.
npmRebuild: false
mac:
  # The .app only; scripts/package-desktop.ts signs it ad hoc.
  target:
    - target: dir
      arch: [arm64]
  category: public.app-category.books
  icon: icon.png
  # Signed ad hoc afterwards by scripts/package-desktop.ts.
  identity: null
  extendInfo:
    # System file types, so Finder matches every EPUB and PDF however it is named.
    CFBundleDocumentTypes:
      - CFBundleTypeName: EPUB book
        CFBundleTypeRole: Viewer
        LSHandlerRank: Owner
        LSItemContentTypes: [org.idpf.epub-container]
      - CFBundleTypeName: PDF document
        CFBundleTypeRole: Viewer
        LSHandlerRank: Alternate
        LSItemContentTypes: [com.adobe.pdf]
      - CFBundleTypeName: FB2 book
        CFBundleTypeRole: Viewer
        LSHandlerRank: Alternate
        LSItemContentTypes: [ru.gribuser.fictionbook.fb2, ru.gribuser.fictionbook.fbz]
    # macOS has no FB2 types of its own. `.fb2.zip` is left out: claiming it would claim `.zip`.
    UTImportedTypeDeclarations:
      - UTTypeIdentifier: ru.gribuser.fictionbook.fb2
        UTTypeDescription: FB2 book
        UTTypeConformsTo: [public.xml, public.data]
        UTTypeTagSpecification:
          public.filename-extension: [fb2]
          public.mime-type: [application/x-fictionbook+xml]
      - UTTypeIdentifier: ru.gribuser.fictionbook.fbz
        UTTypeDescription: Zipped FB2 book
        UTTypeConformsTo: [public.zip-archive, public.data]
        UTTypeTagSpecification:
          public.filename-extension: [fbz]
          public.mime-type: [application/x-zip-compressed-fb2]
